<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood & Record | 메인</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #121214; color: #ffffff; font-family: 'Pretendard', sans-serif; line-height: 1.6; }
        a { text-decoration: none; color: inherit; display: block; }
        ul { list-style: none; }

        [class*="c_"] { float: left; padding: 10px; width: 100%; }
        .clearfix::after { content: ""; display: block; clear: both; }

        @media only screen and (min-width: 768px) {
            .c_4 { width: 33.33%; }
            .c_6 { width: 50%; }
            .c_8 { width: 66.66%; }
            .c_12 { width: 100%; }
        }

        header { padding: 20px 40px; border-bottom: 1px solid #333; overflow: hidden; }
        .logo { font-size: 24px; font-weight: bold; float: left; margin-top: 5px; color: #00e5ff; }
        .gnb { float: right; overflow: hidden; }
        .gnb li { float: left; margin-left: 30px; }
        .gnb li a { padding-bottom: 5px; border-bottom: 2px solid transparent; transition: 0.3s; }
        .gnb li a:hover { color: #00e5ff; border-bottom: 2px solid #00e5ff; }

        .hero { 
            height: 400px; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('img/photo.jpeg') no-repeat center/cover; 
            margin-bottom: 40px; 
            text-align: center;
            padding-top: 150px; 
        }
        
        .card { 
            background: #1e1e22; 
            border-radius: 8px; 
            overflow: hidden; 
            border: 1px solid #333; 
            height: 350px; 
            margin-bottom: 20px;
        }
        .card img { 
            width: 100%; 
            height: 200px; 
            object-fit: cover; 
            display: block; 
        }
        .card-body { 
            height: 150px; 
            padding-top: 40px; 
            text-align: center; 
        }
        .card-body h4 { font-size: 18px; margin-bottom: 10px; }
        .card-body p { color: #aaa; font-size: 15px; }

        footer { text-align: center; padding: 40px; border-top: 1px solid #333; color: #777; margin-top: 60px; clear: both; display: block; width: 100%; position: relative; z-index: 10; background-color: #121214; }

        @media only screen and (max-width: 767px) {
            header { text-align: center; padding: 15px; }
            .logo { float: none; display: inline-block; margin-bottom: 15px; }
            .gnb { float: none; display: inline-block; }
            .gnb li { margin: 0 10px 10px 10px; }
            .hero { padding-top: 130px; }
        }
    </style>
</head>
<body>

    <header class="clearfix">
        <div class="logo"><a href="index.html">Mood & Record</a></div>
        <ul class="gnb">
            <li><a href="situation.html">상황별 큐레이션</a></li>
            <li><a href="genre.html">장르별 탐색</a></li>
            <li><a href="artist.html">이달의 아티스트</a></li>
            <li><a href="hidden.html">숨은 명곡 찾기</a></li>
            <li><a href="trend.html">음악 트렌드</a></li>
        </ul>
    </header>

    <section class="hero c_12">
        <div>
            <h2 style="font-size: 36px; margin-bottom: 10px; font-weight: bold; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">지금 이 순간, 당신의 감정을 채우는 한 곡</h2>
            <p style="color: #ddd; font-size: 18px;">기계적 알고리즘이 아닌, 한 사람의 감성이 고른 한 곡</p>
        </div>
    </section>

    <div class="clearfix" style="max-width: 1200px; margin: 0 auto;">
        
        <h3 style="margin-bottom: 20px; color: #00e5ff; padding-left: 10px;">오늘의 추천 & 아티스트</h3>
        
        <div class="c_4">
            <div class="card">
                <img src="img/photo1-1.jpeg" alt="비오는날">
                <div class="card-body">
                    <h4>#비오는날 카페</h4>
                </div>
            </div>
        </div>
        <div class="c_4">
            <div class="card">
                <img src="img/photo1-2.jpeg" alt="퇴근길">
                <div class="card-body">
                    <h4>#퇴근길 텐션</h4>
                </div>
            </div>
        </div>
        <div class="c_4">
            <div class="card">
                <img src="img/photo1-3.jpeg" alt="아티스트">
                <div class="card-body">
                    <h4>아티스트: 검정치마</h4>
                    <p>심층 매거진 가이드 보러가기</p>
                </div>
            </div>
        </div>

    </div>

    <footer><p>&copy; 2026 Mood & Record. All rights reserved.</p></footer>
</body>
</html>
